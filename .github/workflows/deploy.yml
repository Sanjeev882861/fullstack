name: Deploy TypeScript Node.js to AWS Lambda

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript project
        run: npm run build

      - name: Prune dev dependencies for production
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          cd dist
          zip -r ../function.zip .
          cd ..
          zip -ur function.zip node_modules package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name myFullStack \
            --zip-file fileb://function.zip

      - name: Wait for Lambda update to complete
        run: aws lambda wait function-updated-v2 --function-name myFullStack

      - name: Configure Lambda runtime and environment
        run: |
          aws lambda update-function-configuration \
            --function-name myFullStack \
            --runtime nodejs22.x \
            --handler app.handler \
            --timeout 30 \
            --environment "Variables={MONGODB_URI=${{ secrets.MONGODB_URI }}}"
          aws lambda wait function-updated-v2 --function-name myFullStack